<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pays Membres - RACE</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Charte RACE */
            --primary-orange: #C67240;
            --orange-light: #D98555;
            --orange-dark: #B36030;
            --dark-teal: #04343c;
            --light-bg: #FFF8F3;
            --text-dark: #1a1a1a;
            --text-muted: #6b6b6b;
            --border-light: #E8DDD5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light-bg);
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--dark-teal) 0%, #084e58 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(198, 114, 64, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(198, 114, 64, 0.2);
            color: var(--orange-light);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border: 1px solid rgba(198, 114, 64, 0.3);
            animation: fadeInDown 0.8s ease-out;
        }

        .hero h1 {
            font-family: 'Merriweather', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .hero-highlight {
            color: var(--primary-orange);
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.15rem);
            line-height: 1.7;
            margin-bottom: 0;
            opacity: 0.95;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Content */
        .main-content {
            padding: 60px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Search & Stats Section */
        .search-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            margin-bottom: 40px;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 15px 55px 15px 20px;
            border: 2px solid var(--border-light);
            border-radius: 50px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 8px 30px rgba(198, 114, 64, 0.15);
        }

        .search-icon {
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-orange);
            font-size: 1.2rem;
        }

        /* Quick Stats */
        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            text-align: center;
            padding: 20px;
            background: var(--light-bg);
            border-radius: 15px;
            border: 2px solid var(--border-light);
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            border-color: var(--primary-orange);
            box-shadow: 0 10px 30px rgba(198, 114, 64, 0.15);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary-orange);
            font-family: 'Merriweather', serif;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 500;
        }

        /* Filter Buttons */
        .filter-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid var(--border-light);
            background: white;
            color: var(--text-dark);
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 5px;
            display: inline-block;
        }

        .filter-btn:hover {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--primary-orange);
            color: white;
            border-color: var(--primary-orange);
            box-shadow: 0 4px 20px rgba(198, 114, 64, 0.3);
        }

        /* Country Cards Grid */
        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Country Card */
        .country-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            cursor: pointer;
            animation: fadeInScale 0.6s ease-out both;
        }

        .country-card:nth-child(1) { animation-delay: 0.05s; }
        .country-card:nth-child(2) { animation-delay: 0.1s; }
        .country-card:nth-child(3) { animation-delay: 0.15s; }
        .country-card:nth-child(4) { animation-delay: 0.2s; }
        .country-card:nth-child(5) { animation-delay: 0.25s; }
        .country-card:nth-child(6) { animation-delay: 0.3s; }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(15px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .country-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-orange), var(--orange-light));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
            z-index: 1;
        }

        .country-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(198, 114, 64, 0.15);
            border-color: var(--border-light);
        }

        .country-card:hover::before {
            transform: scaleX(1);
        }

        /* Flag Section */
        .flag-section {
            position: relative;
            height: 200px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .flag-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .country-card:hover .flag-img {
            transform: scale(1.1);
        }

        .region-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-orange);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 2;
        }

        /* Country Info */
        .country-info {
            padding: 25px 20px;
        }

        .country-name {
            font-family: 'Merriweather', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-teal);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .country-institution {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.5;
        }

        .country-institution i {
            color: var(--primary-orange);
            margin-top: 3px;
            flex-shrink: 0;
        }

        .country-institution span {
            flex: 1;
        }

        /* Country Stats */
        .country-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid var(--light-bg);
        }

        .country-stat {
            text-align: center;
        }

        .country-stat-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-orange);
            line-height: 1;
        }

        .country-stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            display: none;
        }

        .empty-state.show {
            display: block;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--border-light);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-family: 'Merriweather', serif;
            font-size: 1.8rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                padding: 40px 20px;
            }

            .main-content {
                padding: 40px 15px;
            }

            .countries-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .quick-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .search-section {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .quick-stats {
                grid-template-columns: 1fr;
            }

            .stat-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-badge">
                <i class="fas fa-globe-africa"></i> Réseau Africain
            </div>
            <h1>
              Institutions Membres
            </h1>
        </div>
    </section>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Search & Stats Section -->
        <div class="search-section">
            <div class="search-wrapper">
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Rechercher un pays par nom, institution ou région..."
                >
                <i class="fas fa-search search-icon"></i>
            </div>

            <div class="quick-stats" id="quickStats">
                <div class="stat-box">
                    <div class="stat-number" id="totalCountries">17</div>
                    <div class="stat-label">Pays</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalInstitutions">24+</div>
                    <div class="stat-label">Institutions</div>
                </div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-region="all">
                <i class="fas fa-globe-africa"></i> Tous les Pays
            </button>
            <button class="filter-btn" data-region="nord">
                <i class="fas fa-compass"></i> Afrique du Nord
            </button>
            <button class="filter-btn" data-region="ouest">
                <i class="fas fa-map-marker-alt"></i> Afrique de l'Ouest
            </button>
            <button class="filter-btn" data-region="centre">
                <i class="fas fa-map"></i> Afrique Centrale
            </button>
            <button class="filter-btn" data-region="est">
                <i class="fas fa-location-arrow"></i> Afrique de l'Est
            </button>
        </div>

        <!-- Countries Grid -->
        <div class="countries-grid" id="countriesGrid">
            <!-- Cards will be generated by JavaScript -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <i class="fas fa-search"></i>
            <h3>Aucun résultat</h3>
            <p>Aucun pays ne correspond à votre recherche</p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function() {
            'use strict';

            // Données des pays membres RACE
            const countriesData = [
                {
                    id: 1,
                    name: "Maroc",
                    institution: "CSEFRS - Conseil Supérieur de l'Éducation, de la Formation et de la Recherche Scientifique",
                    region: "nord",
                    regionLabel: "Nord",
                    institutionCount: 1,
                    members: 5,
                    flag: "https://flagcdn.com/w640/ma.png"
                },
                {
                    id: 2,

                    institution: "Conseil National de l'Éducation",
                    region: "ouest",
                    regionLabel: "Ouest",
                    institutionCount: 1,
                    members: 2,
                    flag: "https://flagcdn.com/w640/bj.png"
                },
                {
                    id: 3,
                    name: "Burkina Faso",
                    institution: "Conseil National de l'Éducation / Ministère de l'Éducation",
                    region: "ouest",
                    regionLabel: "Ouest",
                    institutionCount: 2,
                    members: 2,
                    flag: "https://flagcdn.com/w640/bf.png"
                },
                {
                    id: 4,
                    name: "Burundi",
                    institution: "Conseil National de l'Éducation",
                    region: "est",
                    regionLabel: "Est",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/bi.png"
                },
                {
                    id: 5,
                    name: "Cameroun",
                    institution: "Conseil National de l'Éducation",
                    region: "centre",
                    regionLabel: "Centre",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/cm.png"
                },
                {
                    id: 6,
                    name: "Comores",
                    institution: "Conseil National de l'Éducation",
                    region: "est",
                    regionLabel: "Est",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/km.png"
                },
                {
                    id: 7,
                    name: "Congo",
                    institution: "Conseil National de l'Éducation",
                    region: "centre",
                    regionLabel: "Centre",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/cg.png"
                },
                {
                    id: 8,
                    name: "Côte d'Ivoire",
                    institution: "Conseil National de l'Éducation",
                    region: "ouest",
                    regionLabel: "Ouest",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/ci.png"
                },
                {
                    id: 9,
                    name: "Gabon",
                    institution: "Conseil National de l'Éducation",
                    region: "centre",
                    regionLabel: "Centre",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/ga.png"
                },
                {
                    id: 10,
                    name: "Ghana",
                    institution: "National Education Council",
                    region: "ouest",
                    regionLabel: "Ouest",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/gh.png"
                },
                {
                    id: 11,
                    name: "Malawi",
                    institution: "National Education Council",
                    region: "est",
                    regionLabel: "Est",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/mw.png"
                },
                {
                    id: 12,
                    name: "Mauritanie",
                    institution: "Conseil National de l'Éducation",
                    region: "ouest",
                    regionLabel: "Ouest",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/mr.png"
                },
                {
                    id: 13,
                    name: "Nigeria",
                    institution: "National Education Council",
                    region: "ouest",
                    regionLabel: "Ouest",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/ng.png"
                },
                {
                    id: 14,
                    name: "Rwanda",
                    institution: "Rwanda Education Board / National Education Council",
                    region: "est",
                    regionLabel: "Est",
                    institutionCount: 2,
                    members: 2,
                    flag: "https://flagcdn.com/w640/rw.png"
                },
                {
                    id: 15,
                    name: "Sénégal",
                    institution: "Conseil National de l'Éducation",
                    region: "ouest",
                    regionLabel: "Ouest",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/sn.png"
                },
                {
                    id: 16,
                    name: "Tanzanie",
                    institution: "National Education Council",
                    region: "est",
                    regionLabel: "Est",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/tz.png"
                },
                {
                    id: 17,
                    name: "Tchad",
                    institution: "Conseil National de l'Éducation",
                    region: "centre",
                    regionLabel: "Centre",
                    institutionCount: 1,
                    members: 1,
                    flag: "https://flagcdn.com/w640/td.png"
                }
            ];

            // State
            let currentRegion = 'all';
            let searchQuery = '';

            // Initialize
            document.addEventListener('DOMContentLoaded', function() {
                renderCountries();
                initializeEventListeners();
                updateStats();
                adjustIframeHeight();
            });

            // Render countries
            function renderCountries() {
                const grid = document.getElementById('countriesGrid');
                const emptyState = document.getElementById('emptyState');

                if (!grid || !emptyState) return;

                const filteredCountries = countriesData.filter(country => {
                    const matchesRegion = currentRegion === 'all' || country.region === currentRegion;
                    const matchesSearch = searchQuery === '' ||
                        country.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        country.institution.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        country.regionLabel.toLowerCase().includes(searchQuery.toLowerCase());

                    return matchesRegion && matchesSearch;
                });

                if (filteredCountries.length === 0) {
                    grid.style.display = 'none';
                    emptyState.classList.add('show');
                    setTimeout(adjustIframeHeight, 100);
                    return;
                }

                grid.style.display = 'grid';
                emptyState.classList.remove('show');

                grid.innerHTML = filteredCountries.map(country => `
                    <div class="country-card" data-region="${country.region}">
                        <div class="flag-section">
                            <img src="${country.flag}" alt="Drapeau ${country.name}" class="flag-img"
                                 onerror="this.src='https://via.placeholder.com/640x480/f5f5f5/999999?text=${encodeURIComponent(country.name)}'">
                            <div class="region-badge">${country.regionLabel}</div>
                        </div>
                        <div class="country-info">
                            <h3 class="country-name">${country.name}</h3>
                            <div class="country-institution">
                                <i class="fas fa-university"></i>
                                <span>${country.institution}</span>
                            </div>
                            <div class="country-stats">
                                <div class="country-stat">
                                    <div class="country-stat-number">${country.institutionCount}</div>
                                    <div class="country-stat-label">Institution${country.institutionCount > 1 ? 's' : ''}</div>
                                </div>
                                <div class="country-stat">
                                    <div class="country-stat-number">${country.members}</div>
                                    <div class="country-stat-label">REPRÉSENTANT${country.members > 1 ? 's' : ''}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

                setTimeout(adjustIframeHeight, 300);
            }

            // Initialize event listeners
            function initializeEventListeners() {
                // Filter buttons
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        currentRegion = this.dataset.region;
                        renderCountries();
                        updateStats();
                    });
                });

                // Search input
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('input', function(e) {
                        searchQuery = e.target.value;
                        renderCountries();
                        updateStats();
                    });
                }
            }

            // Update statistics
            function updateStats() {
                const filteredCountries = countriesData.filter(country => {
                    const matchesRegion = currentRegion === 'all' || country.region === currentRegion;
                    const matchesSearch = searchQuery === '' ||
                        country.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        country.institution.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        country.regionLabel.toLowerCase().includes(searchQuery.toLowerCase());

                    return matchesRegion && matchesSearch;
                });

                const totalInstitutions = filteredCountries.reduce((sum, country) => sum + country.institutionCount, 0);
                const regions = new Set(filteredCountries.map(c => c.region));

                document.getElementById('totalCountries').textContent = filteredCountries.length;
                document.getElementById('totalInstitutions').textContent = totalInstitutions + '+';
                document.getElementById('totalRegions').textContent = currentRegion === 'all' ? regions.size : 1;
            }

            // Adjust iframe height
            function adjustIframeHeight() {
                try {
                    const height = Math.max(
                        document.body.scrollHeight,
                        document.body.offsetHeight,
                        document.documentElement.clientHeight,
                        document.documentElement.scrollHeight,
                        document.documentElement.offsetHeight
                    );

                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            type: 'iframe-resize',
                            height: height
                        }, '*');
                    }
                } catch (e) {
                    console.log('Iframe height adjustment:', e);
                }
            }

            // Listen for window resize
            window.addEventListener('resize', adjustIframeHeight);

            // Re-adjust on images loaded
            window.addEventListener('load', function() {
                setTimeout(adjustIframeHeight, 500);
            });

            // Observer for content changes
            const observer = new MutationObserver(adjustIframeHeight);
            observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
